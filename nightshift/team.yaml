# NightShift starter team (Phase 0, Step 2).
# Apply: node --experimental-strip-types server/openmausbot.ts team apply nightshift/team.yaml --url http://127.0.0.1:PORT
# Check: the same with --check prints "No changes." when the workspace matches this file (routines included).
# Bot names are working names for Phase 0; do not rename until the user confirms the final names.
version: 1

# Every bot is at Ask, the chief included: no bot here runs with Full access.
defaults:
  approval: ask

teams:
  - name: NightShift
    brief: { file: souls/team-brief.md }

bots:
  # The server's own chief bot, made at its first start with Full access. Listed only to hold it at Ask; its team,
  # folder, model and computer stay as they are.
  - name: NightShift
    approval: ask

  - name: Researcher
    team: NightShift
    cwd: C:\Users\SNMENT\workspace\NightShift
    title: Live-web researcher
    description: Searches the web first, opens the official page, cites URL and date, and writes a research packet.
    # Claude Code engine (driver claudeAgent), live WebSearch + WebFetch, read-only for code.
    model: claude/claude-sonnet-5-5
    # Swap back to grok / grok-4.7 when the user gets Grok — one-line change, no code change.
    # model: grok/grok-4.7
    approval: ask
    # No computer and no managed browser: WebSearch and WebFetch are the engine's own tools. On computer local every
    # turn fails on a server running without the desktop app, so no routine could run while nobody is there.
    computer: off
    browser: false
    soul: { file: souls/researcher.md }

  - name: Builder
    team: NightShift
    cwd: C:\Users\SNMENT\workspace\NightShift
    title: Builder on its own feat branch
    description: Builds from a task and its research packet on feat/<task-slug>, then writes a handoff packet.
    model: claude/claude-opus-5-5
    approval: ask
    computer: off
    browser: false
    soul: { file: souls/builder.md }

  - name: Reviewer
    team: NightShift
    cwd: C:\Users\SNMENT\workspace\NightShift
    title: Diff-only code reviewer
    description: Reviews the handoff packet and the diff only. Read-only except review notes.
    model: codex/gpt-6.1-sol
    approval: ask
    computer: off
    browser: false
    soul: { file: souls/reviewer.md }

  - name: Keeper
    team: NightShift
    cwd: C:\Users\SNMENT\workspace\NightShift
    title: Memory, queue and reports
    description: Owns MEMORY.md, the task queue, status questions and the Done report to the user.
    model: claude/claude-sonnet-5-5
    approval: ask
    computer: off
    browser: false
    soul: { file: souls/keeper.md }

routines:
  # Keeper's research routine: each run starts a research-only review-loop task for the Researcher, who writes
  # docs/research/<slug>-YYYY-MM-DD.md in the task's worktree; Keeper then reports it and may propose a MEMORY.md
  # change (shown as a diff, saved only after approval). Nothing is pushed, merged, deployed, sent, paid or deleted.
  - name: Weekly agent tooling scan
    bot: Keeper
    schedule: { cron: "0 6 * * MON", timeZone: UTC }
    research:
      title: Agent tooling scan
      base: nightshift/phase0
      description: |
        What changed in the last week in the engines the NightShift bots run on (Claude Code, Codex CLI, Grok CLI):
        new releases, model ids, prices, limits and breaking changes. Official release notes and docs only.
        Say what the Builder should and should not use. Keep it short.
    enabled: true
